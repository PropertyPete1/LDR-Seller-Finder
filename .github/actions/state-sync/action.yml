name: "Sync SQLite State (Encrypted)"
description: "Pull/push the SQLite state DB from/to the 'state' branch with AES-256 encryption, compare-and-swap and merge-on-conflict"

# The protocol lives in src/seller_finder/state_sync.py, which is where its
# docstring explains it and where tests/test_state_sync.py drives it against
# real git repositories. This file is the wiring only.
#
# WHY IT IS NOT A WHOLE-FILE OVERWRITE ANY MORE
#
# Ported from LDR-Automation-Clean (its issue #9, PRs #10 and #11). The old push
# encrypted whatever this job happened to hold, checked out the orphan 'state'
# branch, and committed the file as a whole-file blob. Two hazards, both of
# which fired over there:
#
#   * A job that pulled before a sibling's push and finished after it threw away
#     everything the sibling had written — and both pushes reported success.
#     That is what made 2026-08-11 permanent in the sibling repo.
#   * `git checkout state` refuses over one modified tracked file, and the
#     `|| git checkout --orphan state` fallback then dies with "a branch named
#     'state' already exists" under `bash -e`. Two workflows failed at that step
#     for sixteen hours; every run after it recomputed the day from a DB that
#     had never seen the work and published a confident zero.
#
# Now: pull records the blob SHA the DB came from; push refuses to overwrite a
# branch that has moved since, merging what is there into this run's file first
# (row-level, per table — see state_merge.py) and retrying. Git's fast-forward
# check is the compare-and-swap. There is no force push: after the last attempt
# the step FAILS, which is the whole point — a run whose rows did not land must
# not look like a run that succeeded.
#
# The push no longer checks out anything. It builds the commit with plumbing
# against a temporary index, exactly like publish-telemetry, so HEAD, the
# current branch and the working tree are untouched. The `Publish telemetry`
# step therefore no longer HAS to run before this one (it still does, and
# should: it reads the decrypted DB, and running it first keeps the published
# numbers and the pushed state from the same moment).
#
# The 95 MB size guard moved into state_sync.push, ahead of the commit, for the
# reason it was added at the push site in the first place: this step runs with
# `if: always()`, so a run that failed state.check_state_size() — or crashed
# before reaching it — still gets here.
#
# ── ONE STALE COMMENT LEFT, ON PURPOSE ──────────────────────────────────────
# daily-pull.yml and weekly-pull.yml still say the `Publish telemetry` step
# "MUST stay ahead of 'Push state DB': that step checks out the orphan `state`
# branch and runs `git rm -rf .`". That is no longer true — see above — but the
# bot that ported this change cannot write to .github/workflows/ ("refusing to
# allow a GitHub App to create or update workflow ... without `workflows`
# permission"), so the comment needs an edit through the web UI or a PAT with
# the `workflow` scope. It is stale text, not a hazard: the step order it asks
# for is still the order we want, just for a different reason.

inputs:
  mode:
    description: "'pull' to fetch and decrypt state, 'push' to encrypt and commit state"
    required: true
  github_token:
    description: "GitHub token for pushing"
    required: true
  encryption_key:
    description: "AES-256 passphrase for encrypting/decrypting the state DB"
    required: true

# WHICH FILE IT SYNCS: $DATABASE_PATH, which every workflow already exports at
# the top and which config.DB_PATH reads too — so the sync and the pipeline
# cannot disagree about the path. No input for it, deliberately: an input with
# its own default would silently win over the workflow env.

runs:
  using: "composite"
  steps:
    - name: Pull and decrypt state from 'state' branch
      if: inputs.mode == 'pull'
      shell: bash
      env:
        # env:, never argv — the passphrase is handed to openssl as
        # `-pass env:STATE_KEY` so it cannot surface in a process list or a log.
        STATE_KEY: ${{ inputs.encryption_key }}
      run: |
        PYTHONPATH=src python3 -m seller_finder.state_sync pull

    - name: Encrypt and push state to 'state' branch
      if: inputs.mode == 'push'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        STATE_KEY: ${{ inputs.encryption_key }}
      run: |
        PYTHONPATH=src python3 -m seller_finder.state_sync push
