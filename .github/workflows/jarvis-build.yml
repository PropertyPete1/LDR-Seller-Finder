name: jarvis-build
run-name: "jarvis-build #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
# Fires when LIFESTYLE (or Peter) files a build order. The brain applies the
# `jarvis-build` label at issue-creation time; that label is the only trigger.
#
# Ported from PropertyPete1/lifestyle-brain. The only deliberate divergence is
# the toolchain: this repo is Python + pytest rather than Node, so a Python
# setup step is added and the prompt names this repo's test command. Everything
# else — the trigger, the model resolution, the PR fallback, the notification —
# is kept as-is on purpose; each of those steps encodes a failure the brain's
# workflow already hit.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  build:
    if: github.event.label.name == 'jarvis-build'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ADAPTED FOR THIS REPO: the coder is told below to run the test suite,
      # and it needs an interpreter and the pinned dependencies to do that.
      # 3.11 matches what the pipeline workflows run — requirements.txt pins
      # numpy to the 2.4.x line precisely because 2.5+ requires 3.12.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # The issue body carries a `Coder-Model:` line written by the brain's
      # create_build_order tool. Opus 5 is the default; Fable 5 is opt-in.
      - name: Resolve coder model
        id: model
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          declared="$(printf '%s' "$ISSUE_BODY" | grep -iom1 '^Coder-Model:[[:space:]]*[^[:space:]]*' | sed 's/^[Cc]oder-[Mm]odel:[[:space:]]*//' || true)"

          case "$declared" in
            claude-fable-5) model="claude-fable-5" ;;
            claude-opus-5)  model="claude-opus-5" ;;
            *)
              # Tolerate a human writing "Fable" in prose without the exact string.
              if printf '%s' "$ISSUE_BODY" | grep -qi '\bfable\b'; then
                model="claude-fable-5"
              else
                model="claude-opus-5"
              fi
              ;;
          esac

          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "Coder model: $model"

      - name: Implement the build order
        uses: anthropics/claude-code-action@v1
        env:
          # The coder shells out to `gh` to open its PR; gh reads GH_TOKEN.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: this action has no `model` input — the model is passed
          # through to the Claude CLI via claude_args.
          #
          # Plain `Bash`: CI is an ephemeral sandbox with a repo-scoped token;
          # prefix-matched Bash(cmd:*) rejected the coder's compound commands.
          claude_args: >-
            --model ${{ steps.model.outputs.model }}
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,Bash"
          prompt: |
            You are implementing a build order filed as GitHub issue #${{ github.event.issue.number }}
            in ${{ github.repository }}.

            Title: ${{ github.event.issue.title }}

            The issue body below is the complete specification. Implement it in full.

            ---
            ${{ github.event.issue.body }}
            ---

            Requirements:
            - Work on a NEW branch. Never commit to the default branch.
            - Implement the specification completely. Do not leave TODOs or stubs.
            - Follow the conventions already present in this repository — match its
              existing style, structure, and test approach rather than importing your own.
            - Run the repository's build and test commands and make sure they pass
              before you finish. In this repo that is:

                  python3 -m pytest tests/ -v

              Dependencies are already installed. Add tests for what you build;
              this suite is written to fail when production code is broken, so a
              test that passes against a stubbed-out implementation is not a test.
            - This repo holds homeowner PII and spends real money per skip-trace.
              Never widen what is stored, logged, or committed beyond what the
              build order asks for, and never commit secrets, keys, or tokens.
            - Open a pull request when done. The PR description must reference
              "Closes #${{ github.event.issue.number }}" and summarise what changed
              and how you verified it.

      # The coder reliably pushes its branch but does not reliably open the PR —
      # model diligence at the end of a long build is not a guarantee. This step
      # makes the PR deterministic: fresh branch + no PR for this issue = open it.
      - name: Open the pull request if the coder didn't
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          git fetch origin --prune

          existing="$(gh pr list --state open --limit 50 \
            --json number,body \
            --jq "[.[] | select((.body // \"\") | test(\"#${ISSUE}\\\\b\"))] | length")"
          if [ "${existing}" != "0" ]; then
            echo "A PR referencing #${ISSUE} already exists — nothing to do."
            exit 0
          fi

          branch="$(git for-each-ref refs/remotes/origin \
            --sort=-committerdate \
            --format='%(refname:short)' \
            | grep -v '^origin/main$' | grep -v '^origin/state$' | head -1 | sed 's#^origin/##')"

          if [ -z "$branch" ]; then
            echo "No candidate branch found — nothing to open."
            exit 0
          fi

          ahead="$(git rev-list --count origin/main..origin/"$branch")"
          if [ "$ahead" = "0" ]; then
            echo "origin/$branch has no commits beyond main — nothing to open."
            exit 0
          fi

          # Only adopt fresh work: the branch tip must belong to this run, not
          # be a leftover from an earlier build.
          tip_age="$(( $(date +%s) - $(git log -1 --format=%ct origin/"$branch") ))"
          if [ "$tip_age" -gt 3600 ]; then
            echo "origin/$branch tip is ${tip_age}s old — predates this run; not opening."
            exit 0
          fi

          subject="$(git log -1 --format=%s origin/"$branch")"
          gh pr create \
            --head "$branch" \
            --title "${subject:-$TITLE}" \
            --body "$(printf 'Closes #%s\n\nOpened by the jarvis-build workflow: the coder pushed `%s` without opening a pull request. Implements the build order in issue #%s.' "$ISSUE" "$branch" "$ISSUE")"
          echo "Opened PR for $branch."

      # The action does not expose the PR number as a documented output, so find
      # it by the closing reference.
      - name: Locate the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          number="$(gh pr list --state open --limit 50 \
            --json number,body,headRefName \
            --jq "[.[] | select((.body // \"\") | test(\"#${ISSUE}\\\\b\"))] | first | .number // empty")"

          if [ -z "$number" ]; then
            echo "No PR found referencing issue #${ISSUE}." >&2
          else
            echo "Found PR #$number"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Ping the brain so Peter's phone lights up. Never fails the job: a missed
      # notification is not a reason to mark a successful build as failed.
      - name: Notify LIFESTYLE
        if: always() && steps.pr.outputs.number != ''
        continue-on-error: true
        env:
          BRAIN_BASE_URL: ${{ secrets.BRAIN_BASE_URL }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
          REPO_NAME: ${{ github.event.repository.name }}
          ISSUE: ${{ github.event.issue.number }}
          PR: ${{ steps.pr.outputs.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          set -uo pipefail
          if [ -z "${BRAIN_BASE_URL:-}" ] || [ -z "${NOTIFY_WEBHOOK_SECRET:-}" ]; then
            echo "BRAIN_BASE_URL or NOTIFY_WEBHOOK_SECRET not set — skipping notification."
            exit 0
          fi

          payload="$(jq -nc \
            --arg repo "$REPO_NAME" \
            --argjson issue "$ISSUE" \
            --argjson pr "$PR" \
            --arg title "$TITLE" \
            '{repo: $repo, issue: $issue, pr: $pr, title: $title}')"

          code="$(curl -sS -o /tmp/notify.out -w '%{http_code}' \
            -X POST "${BRAIN_BASE_URL%/}/api/notify" \
            -H 'Content-Type: application/json' \
            -H "X-Notify-Secret: ${NOTIFY_WEBHOOK_SECRET}" \
            --max-time 20 \
            -d "$payload")" || true

          echo "notify → HTTP ${code:-000}"
          cat /tmp/notify.out 2>/dev/null || true
