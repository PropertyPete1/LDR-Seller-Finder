# Weekly Data Pull — runs Monday 6:00 AM CT
# CT = UTC-6 (CST) or UTC-5 (CDT). Using UTC 11:00 for CDT (summer).
# DST note: GitHub cron uses UTC only. Adjust to 12:00 UTC when CDT ends (~Nov).
name: Weekly Data Pull
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no skip-trace spend, no emails)"
        required: false
        default: "false"
concurrency:
  group: ldr-seller-state
  cancel-in-progress: false
env:
  RUN_MODE: weekly
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  FUB_API_KEY: ${{ secrets.FUB_API_KEY }}
  BATCHDATA_API_KEY: ${{ secrets.BATCHDATA_API_KEY }}
  HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
  LLM_MODEL: claude-sonnet-4-6
  DATABASE_PATH: "data/seller_finder.sqlite3"
jobs:
  weekly-pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install GDAL system libs (FileGDB reading)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin libgdal-dev
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pull state DB
        uses: ./.github/actions/state-sync
        with:
          mode: pull
          github_token: ${{ secrets.GITHUB_TOKEN }}
          encryption_key: ${{ secrets.SQLITE_ENCRYPTION_KEY }}
      - name: Run weekly pull
        run: |
          echo "=== Weekly Pull — DRY_RUN=$DRY_RUN ==="
          python3 run_weekly_pull.py
      - name: Upload pending-leads review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-leads
          path: review/
          retention-days: 30
      - name: Write run summary
        if: always()
        run: |
          if [ -f review/run_summary.md ]; then
            cat review/run_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Push state DB
        if: always()
        uses: ./.github/actions/state-sync
        with:
          mode: push
          github_token: ${{ secrets.GITHUB_TOKEN }}
          encryption_key: ${{ secrets.SQLITE_ENCRYPTION_KEY }}
