# Daily Data Pull — runs Tue-Sat 6:00 AM CT (fast path: new pre-foreclosure
# notices + scoring + skip-trace + FUB push). Monday is covered by the full
# Weekly Data Pull, so the daily cron deliberately skips Monday to avoid a
# duplicate same-day run.
# CT = UTC-6 (CST) or UTC-5 (CDT). Using UTC 11:00 for CDT (summer).
# DST note: GitHub cron uses UTC only. Adjust to 12:00 UTC when CDT ends (~Nov).
name: Daily Data Pull
on:
  schedule:
    - cron: "0 11 * * 2-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no skip-trace spend, no FUB push)"
        required: false
        default: "false"
concurrency:
  group: ldr-seller-state
  cancel-in-progress: false
env:
  RUN_MODE: daily
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  FUB_API_KEY: ${{ secrets.FUB_API_KEY }}
  BATCHDATA_API_KEY: ${{ secrets.BATCHDATA_API_KEY }}
  HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
  LLM_MODEL: claude-sonnet-4-6
  DATABASE_PATH: "data/seller_finder.sqlite3"
jobs:
  daily-pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install GDAL system libs (FileGDB reading)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin libgdal-dev
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pull state DB
        uses: ./.github/actions/state-sync
        with:
          mode: pull
          github_token: ${{ secrets.GITHUB_TOKEN }}
          encryption_key: ${{ secrets.SQLITE_ENCRYPTION_KEY }}
      - name: Run daily pull
        run: |
          echo "=== Daily Pull — DRY_RUN=$DRY_RUN ==="
          python3 run_daily_pull.py
      - name: Upload pending-leads review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-leads-daily
          path: review/
          retention-days: 14
      - name: Write run summary
        if: always()
        run: |
          if [ -f review/run_summary.md ]; then
            cat review/run_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      # MUST stay ahead of 'Push state DB': that step checks out the orphan
      # `state` branch and runs `git rm -rf .`, which takes the decrypted DB
      # this reads with it.
      - name: Publish telemetry
        if: always()
        uses: ./.github/actions/publish-telemetry
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          database_path: ${{ env.DATABASE_PATH }}
      - name: Push state DB
        if: always()
        uses: ./.github/actions/state-sync
        with:
          mode: push
          github_token: ${{ secrets.GITHUB_TOKEN }}
          encryption_key: ${{ secrets.SQLITE_ENCRYPTION_KEY }}
