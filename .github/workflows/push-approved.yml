# Push Approved Leads to Follow Up Boss — MANUAL TRIGGER ONLY.
# This is the approval gate: review the pending-leads artifact from the
# latest Weekly Data Pull run first, then trigger this workflow.
name: Push Approved Leads
on:
  workflow_dispatch:
    inputs:
      exclude_ids:
        description: "Comma-separated lead IDs to EXCLUDE from this push (optional)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (log what would be pushed, touch nothing)"
        required: false
        default: "false"
concurrency:
  group: ldr-seller-state
  cancel-in-progress: false
env:
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  FUB_API_KEY: ${{ secrets.FUB_API_KEY }}
  HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
  LLM_MODEL: claude-sonnet-4-6
  DATABASE_PATH: "data/seller_finder.sqlite3"
jobs:
  push-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pull state DB
        uses: ./.github/actions/state-sync
        with:
          mode: pull
          github_token: ${{ secrets.GITHUB_TOKEN }}
          encryption_key: ${{ secrets.SQLITE_ENCRYPTION_KEY }}
      - name: Push approved leads to FUB
        run: |
          echo "=== Push Approved — DRY_RUN=$DRY_RUN ==="
          python3 run_push_approved.py --exclude-ids "${{ github.event.inputs.exclude_ids }}"
      - name: Push state DB
        if: always()
        uses: ./.github/actions/state-sync
        with:
          mode: push
          github_token: ${{ secrets.GITHUB_TOKEN }}
          encryption_key: ${{ secrets.SQLITE_ENCRYPTION_KEY }}
