# LDR-Seller-Finder settings (non-secret tunables)
#
# To add a new county (Dallas, Tarrant, Harris are scaffolded below):
#   1. Add its name to `counties`.
#   2. Make sure `parcel_sources.<county>` exists with its TxGIO FIPS code
#      (Dallas=48113, Tarrant=48439, Harris=48201).
#   3. Upload the county's parcel zip to the mirror release
#      (scripts/refresh_parcel_mirror.sh handles enabled counties).
#   4. If the county publishes an exemption or foreclosure REST service,
#      add it under `exemption_sources` / `foreclosure_sources`; counties
#      without one automatically use the CSV inbox (data/inbox/).
# See README "Adding a New County" for full instructions.

counties:
  - bexar
  - comal
  - travis

scoring:
  absentee_owner: 30          # mailing address != property address
  divorce_match: 25           # party name matched to parcel owner
  preforeclosure_match: 30    # notice of trustee sale on the property
  owned_10_plus_years: 20     # deed date 10+ years ago (needs deed data)
  homestead_removed: 10       # homestead exemption present before, gone now
  skip_trace_threshold: 40    # minimum score to spend money on a trace
  warm_tier_min: 30           # 30..threshold-1 = "warm": stored, never traced/pushed

# Skip-trace budget per run, by run mode. Weekly (Monday) + daily (Tue-Sat)
# at these defaults = 75 + 5×15 = 150 traces/week max. Worst case in a single
# calendar month is 5 weekly + 22 daily runs = 705 traces ≈ $105.75 at
# $0.15/trace — in practice much lower because the cache never re-bills an
# owner. NOTE: this is a PER-RUN cap only; there is no month-to-date ceiling,
# and each manual workflow_dispatch grants a fresh budget.
# Env var MAX_SKIP_TRACES_PER_RUN overrides both.
skip_trace_budget:
  weekly: 75
  daily: 15

# Estimated cost per skip-trace, used ONLY for spend reporting in the
# diagnostics table and Monday digest (BatchData bills actual usage).
skip_trace_cost_usd: 0.15

# Skip-trace cache policy: MATCHED results are cached forever (already paid
# for). NO-MATCH results expire after this many days so the owner can be
# re-traced later as provider data improves. API errors are never cached.
no_match_retrace_days: 90

# Event signals (preforeclosure, divorce_filing) come from feeds that only
# cover a current window. When a run doesn't re-observe the event, the stored
# signal is carried forward for this many days from the date it was ACTUALLY
# observed (signal.observed_at) so a qualified lead isn't demoted between
# runs — then it expires. Was previously an undocumented code default.
event_signal_retention_days: 120

# Homestead-removed detection is a diff against the previous exemption
# snapshot, so a truncated feed reads as mass removals. Skip the diff when a
# pull returns less than this fraction of the previous snapshot.
exemption_min_snapshot_ratio: 0.5

# TxGIO StratMap land-parcel bulk downloads (CC0, statewide program).
# The loader queries the TxGIO API for the newest "Land Parcels" collection
# automatically. Counties listed here but NOT in `counties` above are
# scaffolded and inactive (enabled: false) until you flip them on.
parcel_sources:
  txgio_collection_search: "land parcels"
  bexar:
    fips: "48029"
    area_type_name: "Bexar"
  comal:
    fips: "48091"
    area_type_name: "Comal"
  travis:
    fips: "48453"
    area_type_name: "Travis"
  # ── Scaffolded (enabled: false — not in `counties` yet) ────────────────
  # To activate: add the county name to `counties`, run
  # scripts/refresh_parcel_mirror.sh from a residential network to upload
  # its parcel zip, and see README "County foreclosure sources" for the
  # foreclosure feed status of each.
  dallas:
    enabled: false
    fips: "48113"
    area_type_name: "Dallas"
  tarrant:
    enabled: false
    fips: "48439"
    area_type_name: "Tarrant"
  harris:
    enabled: false
    fips: "48201"
    area_type_name: "Harris"

# Homestead-exemption lookup (Bexar County ArcGIS parcel layer, Exempts field).
# Comal/Travis have no free exemption feed; module degrades gracefully.
exemption_sources:
  bexar:
    url: "https://maps.bexar.org/arcgis/rest/services/Parcels/MapServer/0/query"
    prop_id_field: "PropID"
    exempts_field: "Exempts"

# Pre-foreclosure (Notice of Trustee Sale) sources.
# Bexar has a clean ArcGIS feed. Counties WITHOUT a `mortgage_url` fall back
# to the CSV inbox: drop data/inbox/foreclosures_<county>_*.csv with columns
# address, zip, doc_number[, city, sale_date] and commit — the next run
# ingests it. Travis: export from tccsearch.org (no clean API — see README).
foreclosure_sources:
  bexar:
    mortgage_url: "https://maps.bexar.org/arcgis/rest/services/CC/ForeclosuresProd/MapServer/0/query"
    tax_url: "https://maps.bexar.org/arcgis/rest/services/CC/ForeclosuresProd/MapServer/1/query"
  travis:
    inbox: true    # CSV inbox only — no clean public feed (see README)

# Only residential-ish parcels are considered. Parcels whose owner name looks
# like a government/institutional entity are skipped (see filters in code).
min_market_value: 40000
max_market_value: 2500000
